<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f7f8fa"/>
<rect x="0" y="0" width="300" height="900" fill="#ffffff" stroke="#e5e7eb"/>
<text x="42" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">🧠 ReflectAI</text>
<text x="42" y="110" font-family="Arial,sans-serif" font-size="16" fill="#6b7280">Human–LLM collaboration</text>
<text x="42" y="180" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Study condition</text>
<rect x="42" y="205" rx="14" width="215" height="48" fill="#eef2ff"/>
<text x="62" y="236" font-family="Arial,sans-serif" font-size="16" fill="#3730a3">Reflective LLM</text>
<rect x="42" y="275" rx="12" width="215" height="95" fill="#f3f4f6"/>
<text x="58" y="302" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#374151">Session</text>
<text x="58" y="328" font-family="Arial,sans-serif" font-size="14" fill="#6b7280">a8f19c4d2e</text>
<text x="58" y="354" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">Transparent heuristic demo</text>

<text x="350" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#111827">Adaptive Reflection Interface</text>
<text x="350" y="108" font-family="Arial,sans-serif" font-size="18" fill="#6b7280">Detect possible over-reliance and preserve user agency.</text>

<rect x="350" y="150" rx="18" width="1015" height="125" fill="#ffffff" stroke="#e5e7eb"/>
<text x="380" y="184" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#111827">Ask the AI a question</text>
<text x="380" y="220" font-family="Arial,sans-serif" font-size="17" fill="#374151">Should I accept a PhD offer if the funding is lower but the supervisor is a better fit?</text>
<rect x="1140" y="214" rx="10" width="185" height="42" fill="#4f46e5"/>
<text x="1165" y="241" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Generate response</text>

<rect x="350" y="310" rx="18" width="1015" height="180" fill="#ffffff" stroke="#e5e7eb"/>
<text x="380" y="347" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">AI response</text>
<text x="380" y="385" font-family="Arial,sans-serif" font-size="16" fill="#374151">Compare the trade-offs explicitly: supervision quality, funding stability, training opportunities,</text>
<text x="380" y="413" font-family="Arial,sans-serif" font-size="16" fill="#374151">and the type of work you want after graduation. Do not treat one factor as automatically decisive.</text>
<rect x="380" y="445" rx="9" width="850" height="28" fill="#fff7ed"/>
<text x="395" y="465" font-family="Arial,sans-serif" font-size="13" fill="#9a3412">Confidence cue: important claims and assumptions should be independently verified.</text>

<rect x="350" y="525" rx="18" width="490" height="285" fill="#ffffff" stroke="#e5e7eb"/>
<text x="380" y="562" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Your decision</text>
<rect x="380" y="590" rx="12" width="120" height="40" fill="#eef2ff"/>
<text x="416" y="616" font-family="Arial,sans-serif" font-size="15" fill="#3730a3">Accept</text>
<rect x="510" y="590" rx="12" width="120" height="40" fill="#f3f4f6"/>
<text x="547" y="616" font-family="Arial,sans-serif" font-size="15" fill="#374151">Revise</text>
<rect x="640" y="590" rx="12" width="120" height="40" fill="#f3f4f6"/>
<text x="681" y="616" font-family="Arial,sans-serif" font-size="15" fill="#374151">Reject</text>
<rect x="380" y="655" rx="10" width="420" height="105" fill="#f9fafb" stroke="#d1d5db"/>
<text x="398" y="684" font-family="Arial,sans-serif" font-size="14" fill="#6b7280">Your final reasoning / revision...</text>

<rect x="875" y="525" rx="18" width="490" height="285" fill="#ffffff" stroke="#e5e7eb"/>
<text x="905" y="562" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Adaptive intervention</text>
<text x="905" y="602" font-family="Arial,sans-serif" font-size="15" fill="#374151">Over-reliance risk</text>
<text x="1200" y="602" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#b45309">HIGH</text>
<rect x="905" y="630" rx="12" width="420" height="130" fill="#fffbeb" stroke="#fcd34d"/>
<text x="925" y="662" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#92400e">Before accepting the AI response:</text>
<text x="925" y="692" font-family="Arial,sans-serif" font-size="14" fill="#78350f">1. What assumption might be wrong?</text>
<text x="925" y="718" font-family="Arial,sans-serif" font-size="14" fill="#78350f">2. What evidence would change your decision?</text>
<text x="925" y="744" font-family="Arial,sans-serif" font-size="14" fill="#78350f">3. Give one alternative or counterargument.</text>

<text x="350" y="860" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af">Prototype interface preview • ReflectAI</text>
</svg>