name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall app.py core.py evaluation.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/reflectai.log 2>&1 &
          PID=$!
          for i in {1..20}; do
            if curl -fsS http://localhost:8501/_stcore/health; then
              kill $PID
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reflectai.log
          kill $PID || true
          exit 1
